name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

# Déploiement : cette app est fusionnée dans le portail RPI (rpi-portail),
# sous /apps/sav/. Le déploiement réel se fait via le script
# build-and-merge.sh du dépôt rpi-portail. L'ancien job "deploy" ci-dessus
# ciblait le projet Firebase rpi-sav-app (obsolète depuis la migration
# vers rpi-portail) et a été retiré.
